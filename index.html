<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusFlow — Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo-icon">⚡</div>
        <div>
          <h2>FocusFlow</h2>
          <span class="subtitle">Task Manager</span>
        </div>
      </div>

      <nav class="nav-menu">
        <button id="filter-all" class="nav-item active">
          <span>📥</span> All Tasks
        </button>
        <button id="filter-active" class="nav-item">
          <span>☀️</span> Active
        </button>
        <button id="filter-completed" class="nav-item">
          <span>📅</span> Completed
        </button>
      </nav>

      <div class="stats-section">
        <h2>Statistics</h2>
        <div class="stats-grid">
          <p>Total: <span id="total-count">0</span></p>
          <p>Completed: <span id="completed-count">0</span></p>
          <p>Remaining: <span id="remaining-count">0</span></p>
        </div>
      </div>

      <button class="btn-add-main" onclick="document.getElementById('task-input').focus()">+ Add Task</button>
    </aside>

    <main class="main-content">
      <header class="top-header">
        <h1>Inbox</h1>
        <div class="search-section">
          <input type="text" id="search-input" placeholder="Search tasks...">
        </div>
      </header>

      <section class="tasks-container">
        <div class="section-title">
          <h2>Tasks</h2>
        </div>

        <div class="input-section">
          <span class="plus-icon">+</span>
          <input type="text" id="task-input" placeholder="Add a new task to your inbox...">
          <button id="add-btn">Add</button>
        </div>

        <ul id="task-list"></ul>
      </section>
    </main>
  </div>

  <div id="task-drawer" class="drawer">
    <div class="drawer-header">
      <button id="close-drawer-btn" class="close-btn">&times;</button>
      <button id="delete-drawer-btn" class="delete-btn">🗑️ Delete</button>
    </div>

    <div class="drawer-body">
      <label>TASK NAME</label>
      <input type="text" id="edit-task-title" class="drawer-input">

      <label>DESCRIPTION</label>
      <textarea id="edit-task-desc" placeholder="Add more details about this task..."></textarea>
    </div>

    <div class="drawer-footer">
      <button id="cancel-drawer-btn" class="btn-secondary">Cancel</button>
      <button id="save-drawer-btn" class="btn-primary">Save Changes</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
